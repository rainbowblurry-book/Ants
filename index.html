<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="{{theme:letterbox}}" />
    <meta
      name="description"
      content="Small ants. Big shots. A turn-based ant artillery game."
    />
    <title>ANTS!</title>
    <!--
      Splash, rotate and fatal shells are inline so they work before the bundle
      loads and after it crashes (DR-012, DR-091, DR-094, DR-175).
      Colours come from theme.json through vite.config.ts (DR-088).
      One "u" is one logical px of the 960x540 canvas under FIT (DR-013).
    -->
    <style>
      /*@theme-vars*/

      @font-face {
        font-family: "Lilita One";
        font-weight: 400;
        font-display: swap;
        src: url("%BASE_URL%fonts/lilita-one-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Nunito";
        font-weight: 700;
        font-display: swap;
        src: url("%BASE_URL%fonts/nunito-latin-700-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Nunito";
        font-weight: 800;
        font-display: swap;
        src: url("%BASE_URL%fonts/nunito-latin-800-normal.woff2") format("woff2");
      }

      :root {
        --u: min(100vw / 960, 100dvh / 540);
      }
      html,
      body {
        position: fixed;
        inset: 0;
        margin: 0;
        overflow: hidden;
        background: var(--letterbox);
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--ink);
        color: var(--on-ink);
        font-family: var(--font-body);
        font-weight: 700;
        text-align: center;
      }
      .shell[hidden] {
        display: none;
      }
      .shell h1,
      .shell h2 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 400;
      }
      .shell p {
        margin: 0;
      }
      .shell :focus-visible {
        outline: 4px solid var(--meaning-white);
        outline-offset: 2px;
        box-shadow: 0 0 0 8px var(--ink);
      }

      /* Splash (DR-091): a 960x540 stage, so the rects match UI.md 4.1. */
      /* No display rule here: an id rule would beat .shell[hidden]. */
      #splash {
        z-index: 10;
        transition: opacity 250ms;
      }
      #splash.is-leaving {
        opacity: 0;
      }
      #splash .stage {
        position: absolute;
        left: 50%;
        top: 50%;
        width: calc(var(--u) * 960);
        height: calc(var(--u) * 540);
        transform: translate(-50%, -50%);
      }
      #splash .wordmark {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(var(--u) * 150);
        transform: translateY(-50%);
        font-size: calc(var(--u) * 64);
        line-height: 1;
        color: var(--secondary);
        -webkit-text-stroke: calc(var(--u) * 8) var(--ink);
        paint-order: stroke fill;
      }
      #splash .track {
        position: absolute;
        left: calc(var(--u) * 240);
        top: calc(var(--u) * 320);
        width: calc(var(--u) * 480);
        height: calc(var(--u) * 32);
        box-sizing: border-box;
        border: calc(var(--u) * 4) solid var(--ink);
        border-radius: 9999px;
        background: var(--ink-soft);
        overflow: hidden;
      }
      #splash .fill {
        width: calc(var(--progress, 0) * 100%);
        height: 100%;
        border-radius: 9999px;
        background: var(--secondary);
        box-shadow: inset 0 calc(var(--u) * -4) 0 var(--secondary-shade);
        transition: width 200ms;
      }
      #splash .label {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(var(--u) * 372);
        font-size: calc(var(--u) * 22);
      }

      /* Rotate (DR-094): phones in portrait only. */
      #rotate {
        z-index: 30;
        display: none;
        gap: 16px;
        padding: 16px;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
      #rotate .phone {
        width: 54px;
        height: 96px;
        box-sizing: border-box;
        border: 4px solid var(--ink);
        border-radius: 16px;
        background: var(--secondary);
        animation: rotate-phone 2.4s ease-in-out infinite;
      }
      @keyframes rotate-phone {
        0% {
          transform: rotate(0deg);
        }
        50%,
        100% {
          transform: rotate(-90deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #rotate .phone {
          animation: none;
          transform: rotate(-90deg);
        }
      }
      #rotate h2 {
        font-size: 40px;
        line-height: 1.05;
      }
      #rotate p {
        font-size: 22px;
      }

      /* Fatal (DR-175): above everything. */
      #fatal {
        z-index: 40;
        padding: 16px;
      }
      #fatal .card {
        box-sizing: border-box;
        width: 100%;
        max-width: 520px;
        max-height: 100%;
        overflow: auto;
        padding: 24px;
        border: 4px solid var(--ink);
        border-radius: 24px;
        background: var(--panel);
        color: var(--on-panel);
      }
      #fatal h2 {
        font-size: 28px;
        line-height: 1.1;
      }
      #fatal p {
        margin-top: 8px;
        font-size: 18px;
      }
      #fatal button {
        min-height: 56px;
        margin-top: 16px;
        padding: 0 32px;
        border: 4px solid var(--ink);
        border-radius: 9999px;
        background: var(--action);
        color: var(--on-action);
        box-shadow: inset 0 -8px 0 var(--action-shade), 0 6px 0 var(--ink);
        font-family: var(--font-display);
        font-size: 28px;
        cursor: pointer;
      }
      #fatal details {
        margin-top: 16px;
        font-size: 16px;
        text-align: left;
        user-select: text;
        -webkit-user-select: text;
      }
      #fatal pre {
        margin: 8px 0 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="sr" class="sr-only" aria-live="polite"></div>

    <div id="splash" class="shell" aria-busy="true">
      <div class="stage">
        <h1 class="wordmark">ANTS!</h1>
        <div class="track" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
          <div class="fill"></div>
        </div>
        <p class="label">Gathering the colony…</p>
      </div>
    </div>

    <div id="rotate" class="shell" aria-live="assertive">
      <div class="phone" aria-hidden="true"></div>
      <h2>Turn your phone sideways</h2>
      <p>ANTS! plays in landscape.</p>
    </div>

    <div id="fatal" class="shell" role="alert" hidden>
      <div class="card">
        <h2>Oh no, the ants tripped!</h2>
        <p id="fatal-body">Something went wrong and the game stopped.</p>
        <button id="fatal-reload" type="button">Reload game</button>
        <details>
          <summary>Details</summary>
          <pre id="fatal-details"></pre>
        </details>
      </div>
    </div>

    <noscript>
      <div class="shell" style="z-index: 40; padding: 16px" role="alert">
        <div style="max-width: 520px">
          <h2>Oh no, the ants tripped!</h2>
          <p>This game needs JavaScript. Please turn it on and reload.</p>
        </div>
      </div>
    </noscript>

    <!-- Classic script on purpose: it must run even if the module bundle fails (DR-175). -->
    <script>
      (() => {
        var shown = false;
        function showFatal(detail, body) {
          if (shown) return;
          shown = true;
          var el = document.getElementById('fatal');
          if (body) document.getElementById('fatal-body').textContent = body;
          document.getElementById('fatal-details').textContent = String(detail || '');
          el.hidden = false;
          document.getElementById('splash').hidden = true;
          document.getElementById('fatal-reload').focus();
        }
        window.__antsFatal = showFatal;
        window.addEventListener('error', (e) => {
          showFatal(e.error?.stack ?? e.message);
        });
        window.addEventListener('unhandledrejection', (e) => {
          var r = e.reason;
          showFatal(r?.stack ?? r);
        });
        document.getElementById('fatal-reload').addEventListener('click', () => {
          location.reload();
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
